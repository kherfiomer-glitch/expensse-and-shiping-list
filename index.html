<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Our Money</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
<header><h1>💚 Our Money</h1><p>Shared with my honey IKRAM ❤️</p></header>
<section class="card">
<h2>Money</h2>
<div class="summary"><div>Current Balance<strong><span id="balance">0</span> DA</strong></div></div>
<a href="shopping.html"><button>🛒 Shopping</button></a>
</section>
<section class="card"><h2>Transactions</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>In</th><th>Out</th><th>Balance</th><th>Added by</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxZB4Hvk3Tomr5Li6ipi3_nw46u9ZA-VZjQxpsygj5PRttJH0g8pVnVJzNlssOwRiem/exec";
const money=n=>Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});
async function load(){const r=await fetch(API_URL+"?t="+Date.now(),{cache:"no-store"});const d=await r.json();if(!d.success)throw Error(d.error);let b=0;const rows=document.getElementById("rows");rows.innerHTML="";(d.transactions||[]).forEach(t=>{b+=t.type==="in"?Number(t.amount):-Number(t.amount);const tr=document.createElement("tr");tr.innerHTML=`<td>${t.date}</td><td>${t.description}</td><td>${t.type==="in"?money(t.amount):""}</td><td>${t.type==="out"?money(t.amount):""}</td><td>${money(b)}</td><td>${t.person}</td>`;rows.appendChild(tr)});document.getElementById("balance").textContent=money(b)}load().catch(e=>alert(e.message));
</script>
</body></html>
