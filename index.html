<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Our Money</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="header"><h1>💚 Our Money</h1><p>Shared with my honey IKRAM ❤️</p></header><section class="balance-card"><span>Current Balance</span><strong id="balance">0.00 DA</strong></section><div class="buttons"><button class="btn money-in" onclick="openForm('in')">＋ Money In</button><button class="btn money-out" onclick="openForm('out')">− Money Out</button><button class="btn shopping" onclick="location.href='shopping.html'">🛒 Shopping</button></div><section class="form-card" id="form"><h2 id="formTitle">Add Money In</h2><div class="form-grid"><label>Amount<input id="amount" type="number" min="0" step="0.01" placeholder="0.00"></label><label>Date<input id="date" type="date"></label><label>Description<input id="description" type="text" placeholder="Salary, groceries..."></label><label>Added by<select id="person"><option>You</option><option>IKRAM</option></select></label></div><div class="form-buttons"><button class="btn cancel" onclick="closeForm()">Cancel</button><button class="btn money-in" id="saveBtn" onclick="saveTransaction()">Save</button></div><p id="message" class="message"></p></section><section class="table-card"><div class="table-scroll"><table><thead><tr><th>Date</th><th>Description</th><th>In</th><th>Out</th><th>Balance</th><th>Added by</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const API_URL="https://script.google.com/macros/s/AKfycbxZB4Hvk3Tomr5Li6ipi3_nw46u9ZA-VZjQxpsygj5PRttJH0g8pVnVJzNlssOwRiem/exec";let transactions=[],currentType="in";
const money=v=>Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+" DA";
function openForm(t){currentType=t;form.classList.add("show");formTitle.textContent=t==="in"?"Add Money In":"Add Money Out";saveBtn.className="btn "+(t==="in"?"money-in":"money-out");date.value=new Date().toISOString().slice(0,10);message.textContent="";amount.focus()}
function closeForm(){form.classList.remove("show")}
async function loadData(){try{const r=await fetch(API_URL+"?t="+Date.now());const d=await r.json();if(!d.success)throw Error(d.error);transactions=d.transactions||[];render()}catch(e){console.error(e);message.textContent="Could not connect to Google Sheets.";render()}}
async function saveTransaction(){const a=Number(amount.value),desc=description.value.trim(),d=date.value,p=person.value;if(!a||!desc||!d){message.textContent="Please enter amount, description and date.";return}saveBtn.disabled=true;saveBtn.textContent="Saving...";try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"addTransaction",type:currentType,amount:a,description:desc,date:d,person:p})});const x=await r.json();if(!x.success)throw Error(x.error);amount.value="";description.value="";message.textContent="Saved ❤️";await loadData()}catch(e){console.error(e);message.textContent="Could not save."}finally{saveBtn.disabled=false;saveBtn.textContent="Save"}}
function render(){rows.innerHTML="";let bal=0;[...transactions].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(t=>{bal+=t.type==="in"?+t.amount:-t.amount;const tr=document.createElement("tr");tr.innerHTML=`<td>${fmt(t.date)}</td><td>${esc(t.description)}</td><td class="green">${t.type==="in"?money(t.amount):"-"}</td><td class="red">${t.type==="out"?money(t.amount):"-"}</td><td>${money(bal)}</td><td>${esc(t.person)}</td>`;rows.appendChild(tr)});balance.textContent=money(bal);if(!transactions.length)rows.innerHTML='<tr><td colspan="6" class="empty">No transactions yet.</td></tr>'}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}loadData();
</script></body></html>
