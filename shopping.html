<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Shopping - Our Money</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="header page-header"><div><button class="back" onclick="location.href='index.html'">←</button><div><h1>🛒 Shopping List</h1><p>Groceries & Legumes</p></div></div></header><section class="shopping-summary"><div><span>Shopping Total</span><strong id="shoppingTotal">0.00 DA</strong></div><div><span>Current Balance</span><strong id="currentBalance">0.00 DA</strong></div><div><span>Balance After Shopping</span><strong id="afterShopping">0.00 DA</strong></div><div><span>Days Until Month End</span><strong id="daysLeft">0</strong></div></section><section class="form-card show"><h2>Add Shopping Item</h2><div class="form-grid"><label>Product<select id="product" onchange="updatePrice()"><option value="">Choose a product</option></select></label><label>Quantity<input id="quantity" type="number" min="0.01" step="0.01" value="1" oninput="updateTotal()"></label><label>Unit Price<input id="unitPrice" type="number" min="0" step="0.01" oninput="updateTotal()"></label><label>Unit<input id="unit" type="text" readonly></label><label>Need it on<input id="needDate" type="date"></label><label>Added by<select id="person"><option>You</option><option>IKRAM</option></select></label></div><div class="calculated-total">Item Total: <strong id="itemTotal">0.00 DA</strong></div><button class="btn shopping" id="addButton" onclick="addItem()">＋ Add to Shopping List</button><p id="message" class="message"></p></section><section class="table-card"><div class="table-scroll"><table><thead><tr><th>Need Date</th><th>Product</th><th>Qty</th><th>Unit Price</th><th>Total</th><th>Added By</th><th></th></tr></thead><tbody id="shoppingRows"></tbody></table></div></section></main><script>
const API_URL="https://script.google.com/macros/s/AKfycbxzNEYZaptTmCn376kbCmm0QzxR1f2S-38J1EmrvupzPh00GWMHgbAfqJ8vErM9T7k9/exec";let products=[],shopping=[],transactions=[];const money=v=>Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+" DA";
async function loadData(){try{const r=await fetch(API_URL+"?t="+Date.now());const d=await r.json();if(!d.success)throw Error(d.error);products=d.products||[];shopping=d.shopping||[];transactions=d.transactions||[];fillProducts();render()}catch(e){console.error(e);message.textContent="Could not connect to Google Sheets."}}
function fillProducts(){product.innerHTML='<option value="">Choose a product</option>';products.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p.product+" — "+money(p.price)+"/"+p.unit;product.appendChild(o)})}
function updatePrice(){if(product.value===""){unitPrice.value="";unit.value="";updateTotal();return}const p=products[+product.value];unitPrice.value=p.price;unit.value=p.unit;updateTotal()}
function updateTotal(){itemTotal.textContent=money((+quantity.value||0)*(+unitPrice.value||0))}
async function addItem(){if(product.value===""||!+quantity.value||!needDate.value){message.textContent="Please choose a product, quantity and date.";return}const p=products[+product.value];addButton.disabled=true;addButton.textContent="Saving...";try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"addShopping",date:needDate.value,product:p.product,quantity:+quantity.value,unit:unit.value,unitPrice:+unitPrice.value,person:person.value})});const x=await r.json();if(!x.success)throw Error(x.error);message.textContent="Added to shopping list ❤️";quantity.value=1;await loadData()}catch(e){console.error(e);message.textContent="Could not save."}finally{addButton.disabled=false;addButton.textContent="＋ Add to Shopping List"}}
async function deleteItem(n){if(!confirm("Remove this item from the shopping list?"))return;try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"deleteShopping",rowNumber:n})});const x=await r.json();if(!x.success)throw Error(x.error);await loadData()}catch(e){message.textContent="Could not delete."}}
function balanceNow(){return transactions.reduce((b,t)=>b+(t.type==="in"?+t.amount:-+t.amount),0)}
function render(){const total=shopping.reduce((s,x)=>s+ +x.total,0),bal=balanceNow();shoppingTotal.textContent=money(total);currentBalance.textContent=money(bal);afterShopping.textContent=money(bal-total);afterShopping.className=bal-total<0?"negative":"";const now=new Date(),last=new Date(now.getFullYear(),now.getMonth()+1,0);daysLeft.textContent=last.getDate()-now.getDate();shoppingRows.innerHTML="";[...shopping].sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${fmt(x.date)}</td><td>${esc(x.product)}</td><td>${x.quantity} ${esc(x.unit)}</td><td>${money(x.unitPrice)}</td><td class="green">${money(x.total)}</td><td>${esc(x.person)}</td><td><button class="delete-btn" onclick="deleteItem(${x.rowNumber})">×</button></td>`;shoppingRows.appendChild(tr)});if(!shopping.length)shoppingRows.innerHTML='<tr><td colspan="7" class="empty">Your shopping list is empty.</td></tr>'}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}needDate.value=new Date().toISOString().slice(0,10);loadData();
</script></body></html>
